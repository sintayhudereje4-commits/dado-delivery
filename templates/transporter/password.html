<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password - Transporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        body { background:#f0f4f8; margin:0; font-family:Inter,sans-serif; }
        .top { background:#1565c0; color:#fff; padding:14px 16px; }
        .top a { color:#fff; text-decoration:none; }
        .wrap { max-width:420px; margin:0 auto; padding:16px; }
        .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:600; margin-bottom:4px; }
        .form-group input { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
        .btn { background:#1565c0; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:600; width:100%; cursor:pointer; }
        .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; font-weight:600; }
        .flash-success { background:#e8f5e9; color:#2e7d32; }
        .flash-error { background:#ffebee; color:#c62828; }
    </style>
</head>
<body>
    <div class="top"><a href="{{ url_for('transporter_dashboard') }}">← Back</a></div>
    <div class="wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        <div class="card">
            <h2 style="margin-top:0;">Change password</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Current password</label>
                    <input type="password" name="current_password" required>
                </div>
                <div class="form-group">
                    <label>New password (min 6)</label>
                    <input type="password" name="new_password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm new password</label>
                    <input type="password" name="new_password2" required minlength="6">
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>
</body>
</html>
