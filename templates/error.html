{% extends "base.html" %}
{% block title %}{{ code }} - {{ settings.site_name }}{% endblock %}
{% block content %}
<section class="container" style="padding:48px 16px;text-align:center;">
    <h1 style="font-size:3rem;color:var(--primary);">{{ code }}</h1>
    <p style="font-size:1.2rem;margin:16px 0;">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Home</a>
</section>
{% endblock %}
